name: CI

# Compile-only check on every push/PR to main. Matrix mirrors release.yml so a
# green CI means the next tagged release will not be the first time we learn
# about a platform / GPU-backend break. Tag pushes are handled by `Release`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            args: '--no-bundle'
            rust_target: ''
            timeout_minutes: 45

          - name: macos-x64
            platform: macos-latest
            args: '--no-bundle --target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            timeout_minutes: 45

          - name: linux-x64
            platform: ubuntu-22.04
            args: '--no-bundle'
            rust_target: ''
            timeout_minutes: 45

          - name: windows-x64
            platform: windows-latest
            # CPU build on hosted runners (see tauri.ci-windows.conf.json).
            args: '--no-bundle --config tauri.ci-windows.conf.json'
            rust_target: ''
            timeout_minutes: 75

    runs-on: ${{ matrix.platform }}
    timeout-minutes: ${{ matrix.timeout_minutes }}

    # Skip duplicated runs: pushes to main fire the `push` event AND open a PR
    # (if any), so we don't want to count the same commit twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies (WebKit + Vulkan + Ninja)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf \
            libvulkan-dev vulkan-tools glslang-tools spirv-tools \
            mesa-vulkan-drivers

      - name: Setup Ninja (Windows)
        if: matrix.name == 'windows-x64'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Hosted Windows runners cannot reliably install CUDA (Jimver tool-cache
      # breakage + silent network installer flakiness). CI/Release builds the
      # CPU backend by clearing platform features; local GPU still uses
      # tauri.windows.conf.json + scripts/windows-gpu-dev.ps1.
      - name: Configure Windows build env
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\tbx | Out-Null
          $target = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target'
          if (Test-Path $target) {
            $item = Get-Item $target
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              cmd /c rmdir "$target"
            } else {
              Remove-Item $target -Recurse -Force
            }
          }
          cmd /c mklink /J "$target" C:\tbx
          if ($LASTEXITCODE -ne 0) { throw "mklink failed for $target -> C:\tbx" }

      - name: Resolve Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -n1)"
          if [ -z "$CHANNEL" ]; then
            echo "::error::could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Add Rust cross target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ci-${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        # `--no-bundle` validates Rust + JS without packaging installers;
        # `Release` produces the real artifacts.
        run: pnpm tauri build ${{ matrix.args }}
