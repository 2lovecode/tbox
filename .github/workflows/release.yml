name: Release

# Push a `v*` tag → build Windows / macOS (arm64 + x86_64) / Linux installers
# and attach them to one draft GitHub Release via `tauri-apps/tauri-action`.
# Review notes + assets, then publish the draft manually.
#
# Platform GPU backends match local defaults (see tauri.*.conf.json):
#   Windows → CUDA, Linux → Vulkan, macOS aarch64 → Metal (Cargo target cfg).
# Updater signing is intentionally not enabled yet — wire
# TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) and `createUpdaterArtifacts` once
# secrets + tauri.conf updater block are ready.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Reserved for future macOS notarization / OIDC once signing secrets land.
  id-token: write

env:
  # Shared by cargo / cmake subprocesses; also forced in src-tauri/.cargo/config.toml.
  CMAKE_GENERATOR: Ninja

jobs:
  release:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (host = aarch64). Metal comes from Cargo.toml target cfg.
          - name: macos-arm64
            platform: macos-latest
            args: ''
            rust_target: ''
            bundle_subdir: release/bundle
            timeout_minutes: 60

          # Intel Mac via cross-compile on the arm64 runner (macos-13 retired).
          - name: macos-x64
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            bundle_subdir: x86_64-apple-darwin/release/bundle
            timeout_minutes: 60

          - name: linux-x64
            platform: ubuntu-22.04
            args: ''
            rust_target: ''
            bundle_subdir: release/bundle
            timeout_minutes: 60

          - name: windows-x64
            platform: windows-latest
            args: ''
            rust_target: ''
            bundle_subdir: release/bundle
            timeout_minutes: 90

    runs-on: ${{ matrix.platform }}
    # CUDA + llama.cpp on Windows is the long pole; other platforms finish sooner.
    timeout-minutes: ${{ matrix.timeout_minutes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "v$APP_VERSION" ]; then
            echo "::error::tag '$TAG' does not match app version 'v$APP_VERSION' (src-tauri/tauri.conf.json). Bump the version before pushing the tag."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux dependencies (WebKit + Vulkan + Ninja)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf \
            libvulkan-dev vulkan-tools glslang-tools spirv-tools \
            mesa-vulkan-drivers

      - name: Setup Ninja (Windows)
        if: matrix.name == 'windows-x64'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install CUDA Toolkit (Windows)
        if: matrix.name == 'windows-x64'
        uses: Jimver/cuda-toolkit@v0.2.27
        id: cuda-toolkit
        with:
          cuda: '12.6.3'
          method: network
          # Minimal set for llama-cpp / ggml-cuda (nvcc + runtime + cublas).
          sub-packages: '["nvcc", "cudart", "cudart_dev", "cublas", "cublas_dev"]'
          # Legacy cache backends are broken / disk-hungry on current runners.
          use-github-cache: false
          use-local-cache: false

      - name: Configure Windows CUDA env
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $cuda = $env:CUDA_PATH
          if (-not $cuda) { $cuda = "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" }
          if (-not $cuda -or -not (Test-Path (Join-Path $cuda 'bin\nvcc.exe'))) {
            throw "CUDA toolkit not found (CUDA_PATH=$cuda)"
          }
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_CUDA_COMPILER=$cuda\bin\nvcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Path=$cuda\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Junction keeps object paths short (MAX_PATH) while leaving
          # src-tauri/target in place for tauri-action + rust-cache.
          New-Item -ItemType Directory -Force -Path C:\tbx | Out-Null
          $target = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target'
          if (Test-Path $target) {
            $item = Get-Item $target
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              cmd /c rmdir "$target"
            } else {
              Remove-Item $target -Recurse -Force
            }
          }
          cmd /c mklink /J "$target" C:\tbx
          if ($LASTEXITCODE -ne 0) { throw "mklink failed for $target -> C:\tbx" }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master

      - name: Add Rust cross target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Isolate caches per matrix cell (CUDA vs Vulkan vs Metal vs cross).
          shared-key: release-${{ matrix.name }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV_TAG="$(git tag --sort=-version:refname | grep -vFx "$CURRENT" | head -n 1 || true)"

          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..$CURRENT"
            echo "## Changes since $PREV_TAG" > /tmp/notes.md
          else
            RANGE="HEAD"
            echo "## First release" > /tmp/notes.md
          fi

          echo >> /tmp/notes.md
          git log --pretty=format:'- %s (%an)' --max-count=100 "$RANGE" >> /tmp/notes.md
          {
            echo 'body<<EOF'
            cat /tmp/notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app + draft release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Future updater signing (leave unset until secrets + conf exist):
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'tbox v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
          # When updater signing is enabled, set createUpdaterArtifacts / updaterJson
          # in tauri.conf.json and flip includeUpdaterJson to true.
          includeUpdaterJson: false

      - name: Resolve bundle directory
        id: bundle
        shell: bash
        run: |
          DIR="src-tauri/target/${{ matrix.bundle_subdir }}"
          if [ ! -d "$DIR" ]; then
            echo "::error::bundle directory not found: $DIR"
            ls -la src-tauri/target || true
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          node scripts/checksums.mjs \
            "${{ steps.bundle.outputs.dir }}" \
            "SHA256SUMS-${{ matrix.name }}.txt"

      - name: Upload checksums to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "SHA256SUMS-${{ matrix.name }}.txt" \
            --clobber

  # Code signing / notarization intentionally omitted — no Apple / Authenticode
  # secrets yet. Bundles are unsigned; Gatekeeper / SmartScreen will warn on
  # first launch until signing is wired.
