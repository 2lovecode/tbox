[package]
name = "tbox"
version = "0.1.1"
description = "开发者工具箱 - Tauri + Vue + TypeScript"
authors = ["2lovecode <tanklh@outlook.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 端到端 harness 评测：需本机已安装目录内 GGUF 模型
agent-eval = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde-xml-rs = "0.6"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
dirs = "3.0"
reqwest = { version = "0.12.24", features = ["json", "blocking", "stream"] }
image = "0.25"
lopdf = "0.32"
base64 = "0.22"
anyhow = "1.0"

# 加密相关
aes = "0.8"
aes-gcm = "0.10"
rsa = "0.9"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.8"

# 国密算法
libsm = "0.6"

# 编码转换
encoding_rs = "0.8"
percent-encoding = "2.3"

# Punycode (RFC 3492)
punycode = "0.4"

# 正则表达式
regex = "1.10"

# 数据库
mysql = "25"
postgres = "0.19"

# CSV处理
csv = "1.3"

# 时间处理
chrono = "0.4"

# UUID
uuid = { version = "1.10", features = ["v4", "v5", "v7", "serde"] }

# 大数计算
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"

# URL编码
urlencoding = "2.1"

# URL 解析（scheme/host/port/path/query/fragment），用于 Agent 工具 `url.parse`
url = "2"

# SHA1
sha1 = "0.10"

# MD5（已有md-5）

# 系统信息
os_info = "3"

# 硬件信息采集（CPU / 内存 / 磁盘 / 网络，跨平台）
sysinfo = "0.33"

# 拼音
pinyin = "0.4"

# 一次性初始化
once_cell = "1.19"

# 中文分词
jieba-rs = "0.6"
genai = "0.6"

# 嵌入式本地 LLM 推理（llama.cpp Rust 绑定，进程内推理）。
# Apple Silicon 走 Metal GPU（target-specific）；其余平台默认 CPU。
llama-cpp-2 = { version = "0.1", default-features = false, features = ["sampler"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "0.1", default-features = false, features = ["sampler", "metal"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

# Release 构建优化:缩小二进制 + 提升运行时性能。
# 注意:刻意不加 `panic = "abort"`,保留 unwinding,这样 Rust 端命令
# 崩溃时能被前端 errorHandler 优雅捕获,而不是直接整进程退出。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
